server:
  port: ${PORT:8081}
  forward-headers-strategy: framework

spring:
  application:
    name: cloudnest-academy
  datasource:
    # Default: embedded H2 file database (zero setup). Use profile "postgres" for PostgreSQL.
    url: ${DB_URL:jdbc:h2:file:./data/academy;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.auto_quote_keyword: true
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

management:
  endpoints.web.exposure.include: health,info

app:
  name: CloudNest Academy
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail-from: ${MAIL_FROM:no-reply@cloudnest.academy}
  jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-chars-minimum!!}
  access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
  refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
  # When true the login code is returned in the API response (development only!)
  dev-show-otp: ${DEV_SHOW_OTP:true}
  # When true creates demo courses and instructors on first start. Set to false for a clean database.
  seed-demo-data: ${SEED_DEMO_DATA:true}
  upload-dir: ${UPLOAD_DIR:./uploads}
  media-secret: ${MEDIA_SECRET:dev-only-media-secret-change-me}
  media-url-minutes: 240
  refund-days: 14
  subscription-grace-days: ${SUBSCRIPTION_GRACE_DAYS:3}
  gst-percent: 18
  admin-email: ${ADMIN_EMAIL:admin@cloudnest.local}
  admin-password: ${ADMIN_PASSWORD:Admin@12345}
  payments:
    # Simulated payments for local development. MUST be false in production.
    mock-enabled: ${PAYMENTS_MOCK:true}
    razorpay-key-id: ${RAZORPAY_KEY_ID:}
    razorpay-key-secret: ${RAZORPAY_KEY_SECRET:}
    razorpay-webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    stripe-secret-key: ${STRIPE_SECRET_KEY:}
    stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
